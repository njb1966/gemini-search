services:
  crawler:
    build:
      context: ./crawler
    volumes:
      - search_db:/data
      - ./seeds.txt:/seeds/seeds.txt:ro
    environment:
      DB_PATH: /data/search.db
      SEEDS_PATH: /seeds/seeds.txt
    restart: "no"
    networks:
      - internal

  api:
    build:
      context: ./api
    volumes:
      - search_db:/data
    environment:
      DB_PATH: /data/search.db
    depends_on:
      crawler:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - internal

  nginx:
    image: nginx:alpine
    ports:
      - "8090:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - internal

volumes:
  search_db:

networks:
  internal:
    driver: bridge
