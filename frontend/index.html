<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gemini Search</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --fg: #e0e0e0;
      --muted: #888;
      --link: #7eb8f7;
      --accent: #0f3460;
      --border: #2a2a4a;
      --score: #4caf96;
      --success: #4caf96;
      --error: #e07070;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1rem;
    }
    h1 { font-size: 2rem; margin-bottom: 0.25rem; letter-spacing: -0.02em; }
    h2 { font-size: 1rem; font-weight: 600; margin-bottom: 0.75rem; color: var(--fg); }
    .subtitle { color: var(--muted); margin-bottom: 2rem; font-size: 0.9rem; }
    form {
      display: flex;
      gap: 0.5rem;
      width: 100%;
      max-width: 600px;
      margin-bottom: 2rem;
    }
    label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
    input[type="search"], input[type="url"] {
      flex: 1;
      padding: 0.6rem 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--fg);
      font-size: 1rem;
      outline: none;
    }
    input[type="search"]:focus, input[type="url"]:focus { border-color: var(--link); }
    button {
      padding: 0.6rem 1.2rem;
      background: var(--link);
      color: #000;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.5; cursor: default; }
    .results { width: 100%; max-width: 600px; }
    ul { list-style: none; }
    li {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.75rem 1rem;
      margin-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }
    li a {
      color: var(--link);
      text-decoration: none;
      font-size: 0.95rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    li a:hover { text-decoration: underline; }
    .score {
      font-size: 0.75rem;
      color: var(--score);
      font-family: monospace;
      white-space: nowrap;
    }
    .empty, .error-msg {
      text-align: center;
      color: var(--muted);
      margin-top: 1rem;
    }
    .error-msg { color: var(--error); }
    .loading { color: var(--muted); text-align: center; margin-top: 1rem; }
    .submit-section {
      width: 100%;
      max-width: 600px;
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border);
    }
    .submit-msg {
      margin-top: 0.5rem;
      font-size: 0.85rem;
      min-height: 1.2em;
    }
    .submit-msg.success { color: var(--success); }
    .submit-msg.error   { color: var(--error); }
    footer {
      margin-top: 2rem;
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
      max-width: 600px;
    }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <script>
    const API_BASE_URL = "/api";
    const WORKER_SUBDOMAIN = "https://gemini-mini-search-proxy.njburchett.workers.dev";
  </script>

  <h1>Gemini Search</h1>
  <p class="subtitle">Search indexed Gemini capsules</p>

  <div x-data="searchApp()" x-init="init()">
    <form @submit.prevent="doSearch">
      <label for="q">Search query</label>
      <input
        id="q"
        type="search"
        x-model="query"
        placeholder="Search capsules…"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
      >
      <button type="submit" :disabled="loading">Search</button>
    </form>

    <div class="results">
      <div class="loading" x-show="loading">Searching…</div>

      <div class="error-msg" x-show="error && !loading" x-text="error"></div>

      <ul x-show="results.length > 0 && !loading">
        <template x-for="r in results" :key="r.url">
          <li>
            <a
              :href="proxyUrl(r.url)"
              target="_blank"
              rel="noopener noreferrer"
              :title="r.url"
              x-text="r.title || r.url"
            ></a>
            <span class="score" x-text="Math.round(r.score * 100) + '%'"></span>
          </li>
        </template>
      </ul>

      <div
        class="empty"
        x-show="searched && results.length === 0 && !loading && !error"
      >No results found.</div>
    </div>

    <div class="submit-section">
      <h2>Add your capsule</h2>
      <form @submit.prevent="doSubmit">
        <label for="submit-url">Capsule URL</label>
        <input
          id="submit-url"
          type="url"
          x-model="submitUrl"
          placeholder="gemini://your-capsule.example/"
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
        >
        <button type="submit" :disabled="submitting">Add</button>
      </form>
      <p
        class="submit-msg"
        :class="submitStatus.type"
        x-text="submitStatus.msg"
      ></p>
    </div>
  </div>

  <footer>
    <p>
      <strong>Privacy:</strong> Search queries are not logged or stored.
      Capsule URLs are fetched via a proxy and are not associated with your identity.
      No cookies, no tracking. &mdash;
      <a href="/robots.txt">robots.txt</a>
    </p>
  </footer>

  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    function searchApp() {
      return {
        query: "",
        results: [],
        loading: false,
        error: null,
        searched: false,

        submitUrl: "",
        submitting: false,
        submitStatus: { type: "", msg: "" },

        init() {},

        proxyUrl(geminiUrl) {
          return WORKER_SUBDOMAIN + "/?url=" + encodeURIComponent(geminiUrl);
        },

        async doSearch() {
          const q = this.query.trim();
          if (!q) return;

          this.loading = true;
          this.error = null;
          this.results = [];
          this.searched = false;

          try {
            const base = API_BASE_URL.replace(/\/$/, "");
            const resp = await fetch(base + "/search?q=" + encodeURIComponent(q));
            if (!resp.ok) throw new Error("API error: " + resp.status);
            this.results = await resp.json();
            this.searched = true;
          } catch (err) {
            this.error = "Search failed: " + err.message;
          } finally {
            this.loading = false;
          }
        },

        async doSubmit() {
          const url = this.submitUrl.trim();
          if (!url) return;
          if (!url.startsWith("gemini://")) {
            this.submitStatus = { type: "error", msg: "URL must start with gemini://" };
            return;
          }

          this.submitting = true;
          this.submitStatus = { type: "", msg: "Fetching capsule…" };

          try {
            const base = API_BASE_URL.replace(/\/$/, "");
            const resp = await fetch(
              base + "/submit?url=" + encodeURIComponent(url),
              { method: "POST" }
            );
            const data = await resp.json();
            if (!resp.ok) {
              this.submitStatus = { type: "error", msg: data.detail || "Submission failed." };
            } else if (data.status === "already_indexed") {
              this.submitStatus = { type: "success", msg: "Already indexed: " + (data.title || url) };
            } else {
              this.submitStatus = { type: "success", msg: "Indexed: " + data.title };
              this.submitUrl = "";
            }
          } catch (err) {
            this.submitStatus = { type: "error", msg: "Submission failed: " + err.message };
          } finally {
            this.submitting = false;
          }
        },
      };
    }
  </script>
</body>
</html>
